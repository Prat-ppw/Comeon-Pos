name: Build BREW POS APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & Capacitor CLI
        run: |
          npm install

      - name: Build web app
        run: npm run build || true

      - name: Capacitor add android (ถ้ายังไม่มี)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Apply Sunmi T2s Android config
        run: |
          if [ -d "android-config" ]; then
            cp android-config/AndroidManifest-patch.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
            cp android-config/styles-patch.xml android/app/src/main/res/values/styles.xml 2>/dev/null || true
            echo "Applied Sunmi T2s config"
          fi

      - name: Set gradlew permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Create Temporary Keystore & Build Release APK
        run: |
          # สร้าง Keystore ชั่วคราวสำหรับการ Sign APK
          keytool -genkeypair -v \
            -keystore android/app/auto-release.keystore \
            -alias brewkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass brewpos1234 \
            -keypass brewpos1234 \
            -dname "CN=BrewPOS, OU=POS, O=Brew, L=BKK, C=TH"

          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=auto-release.keystore \
            -Pandroid.injected.signing.store.password=brewpos1234 \
            -Pandroid.injected.signing.key.alias=brewkey \
            -Pandroid.injected.signing.key.password=brewpos1234 \
            --no-daemon

      - name: Upload Debug & Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brew-pos-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (เฉพาะตอน Push Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## BREW POS ${{ github.ref_name }}
            - **app-release.apk** — ติดตั้งบนเครื่อง POS / Sunmi T2s
            - **app-debug.apk** — เวอร์ชันทดสอบ
