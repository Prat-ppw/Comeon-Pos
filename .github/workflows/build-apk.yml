name: Build BREW POS APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:        # กด Build manually ได้จาก GitHub UI

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ───────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ───────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. Setup Java 17 (required by Android Gradle) ─────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Setup Android SDK ───────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install npm dependencies ────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Build web assets (Vite) ─────────────────────────────
      - name: Build web app
        run: npm run build

      # ── 7. Add & Sync Capacitor ────────────────────────────────
      - name: Capacitor Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # ── 8. Apply Sunmi D2s Plus Patches ────────────────────────
      - name: Apply Sunmi Patches
        run: |
          mkdir -p android/app/src/main/res/values
          cp android-config/AndroidManifest-patch.xml android/app/src/main/AndroidManifest.xml
          cp android-config/styles-patch.xml android/app/src/main/res/values/styles.xml

      # ── 9. Make gradlew executable ─────────────────────────────
      - name: Set gradlew permission
        run: chmod +x android/gradlew

      # ── 10. Build debug APK (ไม่ต้อง sign key) ─────────────────
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # ── 11. Upload APK as artifact ─────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brew-pos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 12. Build release APK (เฉพาะตอน push tag v*) ──────────
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/brew-pos.keystore
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=brew-pos.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --no-daemon

      # ── 13. Create GitHub Release พร้อม APK (เฉพาะ tag) ───────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## BREW POS ${{ github.ref_name }}

            ### ดาวน์โหลด APK
            - **app-release.apk** — สำหรับติดตั้งบน Sunmi D2s Plus (signed)
            - **app-debug.apk** — สำหรับทดสอบ

            ### ติดตั้ง
            1. ดาวน์โหลด `app-release.apk`
            2. Copy ไฟล์ไปที่ Sunmi D2s Plus
            3. เปิด File Manager → กด Install
