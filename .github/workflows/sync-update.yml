name: Build & Release BREW POS APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 🟢 เพิ่มส่วนนี้เพื่อให้ GITHUB_TOKEN มีสิทธิ์สร้าง Release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      - name: Apply Sunmi D2s Plus Patches
        run: |
          mkdir -p android/app/src/main/res/values
          if [ -f "android-config/launch_background.xml" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp android-config/launch_background.xml android/app/src/main/res/drawable/launch_background.xml
          fi
          if [ -f "android-config/AndroidManifest-patch.xml" ]; then
            cp android-config/AndroidManifest-patch.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f "android-config/styles-patch.xml" ]; then
            cp android-config/styles-patch.xml android/app/src/main/res/values/styles.xml
          fi

      - name: Set gradlew permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Publish Release APK to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: BREW POS Update ${{ github.ref_name }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
