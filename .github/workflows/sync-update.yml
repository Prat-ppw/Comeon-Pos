name: Build & Release BREW POS APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ───────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup Node.js 22 ────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Setup Java 17 ───────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Setup Android SDK ───────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install dependencies ────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Build Web Assets ────────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── 7. Capacitor Sync ──────────────────────────────────────
      - name: Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      # ── 8. Apply Sunmi D2s Plus Patches & Optimizations ──────
      - name: Apply Sunmi D2s Plus Patches
        run: |
          mkdir -p android/app/src/main/res/values
          if [ -f "android-config/AndroidManifest-patch.xml" ]; then
            cp android-config/AndroidManifest-patch.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f "android-config/styles-patch.xml" ]; then
            cp android-config/styles-patch.xml android/app/src/main/res/values/styles.xml
          fi

      # ── 9. Set gradlew permissions ──────────────────────────────
      - name: Set gradlew permission
        run: chmod +x android/gradlew

      # ── 10. Build Debug APK (สำหรับทดสอบในเครื่อง) ─────────────
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # ── 11. Upload Debug APK Artifact ─────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brew-pos-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ── 12. Create GitHub Release / Tag Auto-Publish ──────────
      - name: Publish Release APK to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: BREW POS Update ${{ github.ref_name }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
